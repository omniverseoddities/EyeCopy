name: Bug report
description: Report a reproducible problem with EyeCopy.
body:
  - type: markdown
    attributes:
      value: Do not attach personal media, raw profiles, pairing records, device identifiers or unsanitized logs.
  - type: input
    id: version
    attributes:
      label: EyeCopy version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows and device software versions
      description: Include architecture and device model when relevant. Omit device names and identifiers.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a synthetic file when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Remove personal paths, filenames, thumbnails and identifiers before sharing.
